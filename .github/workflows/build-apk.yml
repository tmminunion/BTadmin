name: Build BTadmin Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Analyze, Test & Build BTadmin Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Read Version Metadata
        id: meta
        run: |
          VER_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME=${VER_RAW%%+*}
          VER_CODE=${VER_RAW##*+}
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Android Project & Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          rm -rf android /tmp/btadmin_tpl
          flutter create /tmp/btadmin_tpl --project-name btadmin --org com.bung --platforms=android
          cp -r /tmp/btadmin_tpl/android ./android
          rm -rf /tmp/btadmin_tpl

          python3 - <<'PYEOF'
          import os, re

          # 1. AndroidManifest: INTERNET + label BTadmin
          mpath = "android/app/src/main/AndroidManifest.xml"
          m = open(mpath, "r", encoding="utf-8").read()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="BTadmin"', m)
          open(mpath, "w", encoding="utf-8").write(m)

          # 2. build.gradle(.kts): minSdk 24 + release signingConfig
          gpath = "android/app/build.gradle.kts"
          if not os.path.exists(gpath):
              gpath = "android/app/build.gradle"
          g = open(gpath, "r", encoding="utf-8").read()
          g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          g = g.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")

          if gpath.endswith(".kts"):
              g = "import java.util.Properties\nimport java.io.FileInputStream\n" + g
              signing_block = """
          signingConfigs {
              create("release") {
                  val propsFile = rootProject.file("key.properties")
                  if (propsFile.exists()) {
                      val props = Properties()
                      props.load(FileInputStream(propsFile))
                      storeFile = file(props.getProperty("storeFile"))
                      storePassword = props.getProperty("storePassword")
                      keyAlias = props.getProperty("keyAlias")
                      keyPassword = props.getProperty("keyPassword")
                  }
              }
          }
          """
              g = g.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              g = g.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"release\")")
          else:
              signing_block = """
          signingConfigs {
              release {
                  def propsFile = rootProject.file('key.properties')
                  if (propsFile.exists()) {
                      def props = new Properties()
                      props.load(new FileInputStream(propsFile))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
          }
          """
              g = g.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              g = g.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          open(gpath, "w", encoding="utf-8").write(g)
          PYEOF

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/btadmin-release.jks
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=btadmin-release.jks
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Static Analysis & Unit Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Signed Release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/app-release.apk "BTadmin-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}"
          name: "BTadmin v${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version_code }})"
          body: |
            Rilis resmi **BTadmin** — Aplikasi Kontrol Admin Panel Bungtemin.
            - Dashboard & Statistik Real-Time Native
            - Kontrol Layanan, Protokoler Global, Microsoft SSO, & Menu Aplikasi Native
            - Kontrol WA Notifikasi & Antrean Native
            - 23 Modul Admin Panel via In-App WebView (Tiket 1x pakai 60 detik)
          files: "BTadmin-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"

      - name: Send APK to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILE: "BTadmin-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"
        run: |
          if [ -f "$APK_FILE" ] && [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl -s -F "chat_id=${CHAT_ID}" \
              -F "document=@${APK_FILE}" \
              -F "caption=🚀 BTadmin v${{ steps.meta.outputs.version_name }} (code ${{ steps.meta.outputs.version_code }}) berhasil dibuild & dirilis di GitHub Release!" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" > /dev/null
          fi

      - name: Cleanup Temporary Files & Workflow Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf build android /tmp/btadmin_tpl *.apk
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for AID in $ARTIFACT_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${AID}" >/dev/null 2>&1 || true
          done
